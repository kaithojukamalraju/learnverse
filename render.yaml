services:
  - type: web
    name: learnverse-api
    env: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @learnverse/api build
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
